  <style>
    :root {
      --bg: #0d1117; --card-bg: #161b22; --border: #30363d;
      --text: #c9d1d9; --text-dim: #8b949e; --white: #f0f6fc;
      --critical: #f85149; --high: #d29922; --medium: #388bfd; --low: #8b949e;
      --clean: #3fb950;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 24px; line-height: 1.5; }
    .container { max-width: 1100px; margin: 0 auto; }
    .header { border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { margin: 0; color: var(--white); font-size: 24px; display: flex; align-items: center; gap: 8px; }
    .timestamp { color: var(--text-dim); font-size: 14px; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 16px; text-align: center; }
    .stat-value { font-size: 28px; font-weight: bold; margin-top: 4px; }
    .stat-label { color: var(--text-dim); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }

    .filters { display: flex; gap: 8px; margin-bottom: 24px; }
    .btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn.active, .btn:hover { background: var(--border); color: var(--white); }

    .file-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 16px; overflow: hidden; }
    .file-header { padding: 12px 16px; background: rgba(255,255,255,0.02); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .file-path { font-family: monospace; font-weight: bold; color: var(--white); }
    .badge { padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
    .badge-CRITICAL { background: rgba(248,81,73,0.15); color: var(--critical); border: 1px solid var(--critical); }
    .badge-HIGH { background: rgba(210,153,34,0.15); color: var(--high); border: 1px solid var(--high); }
    .badge-MEDIUM { background: rgba(56,139,253,0.15); color: var(--medium); border: 1px solid var(--medium); }
    .badge-CLEAN { background: rgba(63,185,80,0.15); color: var(--clean); border: 1px solid var(--clean); }

    .findings-list { padding: 16px; }
    .finding-item { border-left: 3px solid var(--border); padding-left: 12px; margin-bottom: 16px; }
    .finding-item:last-child { margin-bottom: 0; }
    .finding-item.CRITICAL { border-color: var(--critical); }
    .finding-item.HIGH { border-color: var(--high); }
    .finding-title { font-weight: bold; color: var(--white); display: flex; gap: 8px; align-items: center; }
    .finding-meta { color: var(--text-dim); font-size: 12px; margin: 4px 0; }
    .matches-box { background: var(--bg); padding: 8px 12px; border-radius: 4px; font-family: monospace; font-size: 13px; color: var(--high); margin-top: 6px; word-break: break-all; }
  </style>
</head>

      <div class="stat-card"><div class="stat-label">Total Issues</div><div class="stat-value" style="color: var(--high)" id="statIssues">0</div></div>
    </div>

    <div class="filters">

    function renderFiles(filter = 'all') {
      const container = document.getElementById('fileContainer');
      container.innerHTML = '';

      data.files.forEach(file => {
        if (filter === 'flagged' && file.status !== 'flagged') return;
        if (filter === 'clean' && file.status !== 'clean') return;

        const card = document.createElement('div');
        card.className = 'file-card';
        
        const topSeverity = file.findings.length > 0 ? file.findings[0].severity : 'CLEAN';

        let findingsHtml = '';
        if (file.findings.length > 0) {
          findingsHtml = '<div class="findings-list">' + file.findings.map(f => `
            <div class="finding-item ${f.severity}">
              <div class="finding-title">
                <span class="badge badge-${f.severity}">${f.severity}</span>

              </div>
              <div class="finding-meta">Category: ${f.category} | Lines: ${f.lines.join(', ') || 'N/A'}</div>

          `).join('') + '</div>';

          ${findingsHtml}
        `;
        container.appendChild(card);
      });

      document.querySelectorAll('.filters .btn').forEach(b => b.classList.remove('active'));
