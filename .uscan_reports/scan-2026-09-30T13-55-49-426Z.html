<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uscan Security Scan Report</title>
  <style>
    :root {
      --bg: #0d1117; --card-bg: #161b22; --border: #30363d;
      --text: #c9d1d9; --text-dim: #8b949e; --white: #f0f6fc;
      --critical: #f85149; --high: #d29922; --medium: #388bfd; --low: #8b949e;
      --clean: #3fb950;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 24px; line-height: 1.5; }
    .container { max-width: 1100px; margin: 0 auto; }
    .header { border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { margin: 0; color: var(--white); font-size: 24px; display: flex; align-items: center; gap: 8px; }
    .timestamp { color: var(--text-dim); font-size: 14px; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 16px; text-align: center; }
    .stat-value { font-size: 28px; font-weight: bold; margin-top: 4px; }
    .stat-label { color: var(--text-dim); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }

    .filters { display: flex; gap: 8px; margin-bottom: 24px; }
    .btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn.active, .btn:hover { background: var(--border); color: var(--white); }

    .file-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 16px; overflow: hidden; }
    .file-header { padding: 12px 16px; background: rgba(255,255,255,0.02); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .file-path { font-family: monospace; font-weight: bold; color: var(--white); }
    .badge { padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
    .badge-CRITICAL { background: rgba(248,81,73,0.15); color: var(--critical); border: 1px solid var(--critical); }
    .badge-HIGH { background: rgba(210,153,34,0.15); color: var(--high); border: 1px solid var(--high); }
    .badge-MEDIUM { background: rgba(56,139,253,0.15); color: var(--medium); border: 1px solid var(--medium); }
    .badge-CLEAN { background: rgba(63,185,80,0.15); color: var(--clean); border: 1px solid var(--clean); }

    .findings-list { padding: 16px; }
    .finding-item { border-left: 3px solid var(--border); padding-left: 12px; margin-bottom: 16px; }
    .finding-item:last-child { margin-bottom: 0; }
    .finding-item.CRITICAL { border-color: var(--critical); }
    .finding-item.HIGH { border-color: var(--high); }
    .finding-title { font-weight: bold; color: var(--white); display: flex; gap: 8px; align-items: center; }
    .finding-meta { color: var(--text-dim); font-size: 12px; margin: 4px 0; }
    .matches-box { background: var(--bg); padding: 8px 12px; border-radius: 4px; font-family: monospace; font-size: 13px; color: var(--high); margin-top: 6px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🛡️ Uscan Security Report</h1>
      <div class="timestamp" id="scanTime"></div>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Total Files</div><div class="stat-value" id="statTotal">0</div></div>
      <div class="stat-card"><div class="stat-label">Flagged Files</div><div class="stat-value" style="color: var(--critical)" id="statFlagged">0</div></div>
      <div class="stat-card"><div class="stat-label">Clean Files</div><div class="stat-value" style="color: var(--clean)" id="statClean">0</div></div>
      <div class="stat-card"><div class="stat-label">Total Issues</div><div class="stat-value" style="color: var(--high)" id="statIssues">0</div></div>
    </div>

    <div class="filters">
      <button class="btn active" onclick="filterReport('all')">All Files</button>
      <button class="btn" onclick="filterReport('flagged')">Flagged Only</button>
      <button class="btn" onclick="filterReport('clean')">Clean Only</button>
    </div>

    <div id="fileContainer"></div>
  </div>

  <script>
    const data = {"scanTime":"2026-09-30T13:55:49.428Z","targetPath":"C:\\Users\\User\\Downloads\\TesTUscan","summary":{"total":12,"flagged":2,"clean":3,"skipped":7,"issues":3},"files":[{"path":"C:\\Users\\User\\Downloads\\TesTUscan\\.uscan_reports\\latest-report.html","status":"skipped","size":8869,"findings":[]},{"path":"C:\\Users\\User\\Downloads\\TesTUscan\\.uscan_reports\\scan-2026-09-30T13-19-05-415Z.html","status":"skipped","size":7856,"findings":[]},{"path":"C:\\Users\\User\\Downloads\\TesTUscan\\.uscan_reports\\scan-2026-09-30T13-19-05-415Z.json","status":"clean","size":1739,"findings":[]},{"path":"C:\\Users\\User\\Downloads\\TesTUscan\\.uscan_reports\\scan-2026-09-30T13-19-05-415Z.log","status":"skipped","size":1185,"findings":[]},{"path":"C:\\Users\\User\\Downloads\\TesTUscan\\.uscan_reports\\scan-2026-09-30T13-24-10-644Z.html","status":"skipped","size":8434,"findings":[]},{"path":"C:\\Users\\User\\Downloads\\TesTUscan\\.uscan_reports\\scan-2026-09-30T13-24-10-644Z.json","status":"clean","size":2485,"findings":[]},{"path":"C:\\Users\\User\\Downloads\\TesTUscan\\.uscan_reports\\scan-2026-09-30T13-24-10-644Z.log","status":"skipped","size":1742,"findings":[]},{"path":"C:\\Users\\User\\Downloads\\TesTUscan\\.uscan_reports\\scan-2026-09-30T13-25-18-136Z.html","status":"skipped","size":8869,"findings":[]},{"path":"C:\\Users\\User\\Downloads\\TesTUscan\\.uscan_reports\\scan-2026-09-30T13-25-18-136Z.json","status":"clean","size":3046,"findings":[]},{"path":"C:\\Users\\User\\Downloads\\TesTUscan\\.uscan_reports\\scan-2026-09-30T13-25-18-136Z.log","status":"skipped","size":2154,"findings":[]},{"path":"C:\\Users\\User\\Downloads\\TesTUscan\\CreatingDepartureSteps.java","status":"flagged","size":2174,"findings":[{"id":"aws_secret","label":"AWS Secret Access Key","severity":"CRITICAL","category":"Cloud","count":1,"lines":[53],"matches":["chec••••••••••••••••••••••••••••••••••••"]}]},{"path":"C:\\Users\\User\\Downloads\\TesTUscan\\Test.py","status":"flagged","size":555,"findings":[{"id":"secret_cfg","label":"Secret in Config","severity":"HIGH","category":"Config","count":1,"lines":[1],"matches":["PASS••••••••••••••••••••••••••••••••••••••••"]},{"id":"env_secret","label":".env Secret Assignment","severity":"HIGH","category":"Config","count":1,"lines":[1],"matches":["TEST••••••••••••••••••••••••••••••••••••••••••••••"]}]}]};

    document.getElementById('scanTime').textContent = new Date(data.scanTime).toLocaleString();
    document.getElementById('statTotal').textContent = data.summary.total;
    document.getElementById('statFlagged').textContent = data.summary.flagged;
    document.getElementById('statClean').textContent = data.summary.clean;
    document.getElementById('statIssues').textContent = data.summary.issues;

    function renderFiles(filter = 'all') {
      const container = document.getElementById('fileContainer');
      container.innerHTML = '';

      data.files.forEach(file => {
        if (filter === 'flagged' && file.status !== 'flagged') return;
        if (filter === 'clean' && file.status !== 'clean') return;

        const card = document.createElement('div');
        card.className = 'file-card';
        
        const topSeverity = file.findings.length > 0 ? file.findings[0].severity : 'CLEAN';

        let findingsHtml = '';
        if (file.findings.length > 0) {
          findingsHtml = '<div class="findings-list">' + file.findings.map(f => `
            <div class="finding-item ${f.severity}">
              <div class="finding-title">
                <span class="badge badge-${f.severity}">${f.severity}</span>
                ${f.label}
              </div>
              <div class="finding-meta">Category: ${f.category} | Lines: ${f.lines.join(', ') || 'N/A'}</div>
              <div class="matches-box">Found: ${f.matches.join(', ')} (${f.count} occurrence${f.count > 1 ? 's' : ''})</div>
            </div>
          `).join('') + '</div>';
        }

        card.innerHTML = `
          <div class="file-header">
            <span class="file-path">${file.path}</span>
            <span class="badge badge-${topSeverity}">${file.status}</span>
          </div>
          ${findingsHtml}
        `;
        container.appendChild(card);
      });
    }

    function filterReport(type) {
      document.querySelectorAll('.filters .btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderFiles(type);
    }

    renderFiles();
  </script>
</body>
</html>
